<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financiera - ÁLAMOS IMPORT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #EBF4FF 0%, #E0E7FF 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo-container {
            flex-shrink: 0;
        }

        .logo {
            max-width: 150px;
            max-height: 100px;
            object-fit: contain;
        }

        .header-text {
            flex: 1;
        }

        .header h1 {
            color: #312E81;
            font-size: 2.5em;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            color: #6366F1;
            font-size: 1.1em;
            font-weight: 500;
        }

        .header .slogan {
            color: #818CF8;
            font-size: 1.3em;
            font-weight: 300;
            font-style: italic;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.8em;
            color: #312E81;
            margin-bottom: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question {
            font-size: 1.3em;
            color: #4B5563;
            margin-bottom: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: white;
            border: 3px solid #E5E7EB;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1em;
            font-weight: 600;
            color: #374151;
        }

        .option-btn:hover {
            border-color: #6366F1;
            background: #EEF2FF;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
        }

        .option-icon {
            font-size: 1.8em;
        }



        .selected-calc {
            background: #EEF2FF;
            border: 2px solid #818CF8;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 1.1em;
            color: #312E81;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 1em;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #D1D5DB;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-group {
            display: flex;
            gap: 15px;
        }

        .input-group select {
            padding: 15px;
            border: 2px solid #D1D5DB;
            border-radius: 12px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #6366F1;
            color: white;
        }

        .btn-primary:hover {
            background: #4F46E5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: #E5E7EB;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #D1D5DB;
        }

        .btn-download {
            background: #10B981;
            color: white;
            margin-top: 20px;
        }

        .btn-download:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .result-box {
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
            border: 3px solid #10B981;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }

        .result-label {
            font-size: 1.1em;
            color: #065F46;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.5em;
            color: #047857;
            font-weight: 700;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #818CF8 0%, #6366F1 100%);
        }

        th {
            padding: 18px;
            text-align: left;
            font-weight: 700;
            color: white;
            font-size: 1em;
        }

        th:not(:first-child) {
            text-align: right;
        }

        td {
            padding: 15px 18px;
            border-bottom: 1px solid #E5E7EB;
            color: #374151;
        }

        td:not(:first-child) {
            text-align: right;
        }

        tbody tr:hover {
            background: #F9FAFB;
        }

        .total-row {
            background: #EEF2FF !important;
            font-weight: 700;
            color: #312E81;
            border-top: 3px solid #6366F1;
        }

        .interes-cell {
            color: #DC2626;
            font-weight: 600;
        }

        .amortizacion-cell {
            color: #2563EB;
            font-weight: 600;
        }

        .saldo-cell {
            font-weight: 700;
            color: #374151;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            th,
            td {
                padding: 10px;
                font-size: 0.9em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header con Logo -->
        <div class="header">
            <div class="logo-container">
                <img src="LogoAlamosImport.jpg" alt="ÁLAMOS IMPORT Logo" class="logo">
            </div>
            <div class="header-text">
                <h1>Calculadora Financiera</h1>
                <p>ÁLAMOS IMPORT</p>
                <div class="slogan">Financiamos tu progreso</div>
            </div>
        </div>

        <!-- Formulario de Cálculo -->
        <div class="card" id="formCard">
            <div class="selected-calc" id="selectedCalc">Calculando: Monto de la Cuota</div>

            <div class="form-group">
                <label class="form-label">📅 Fecha de Inicio del Préstamo</label>
                <input type="date" id="fechaInicio" class="form-input" required>
            </div>

            <div id="capitalGroup" class="form-group">
                <label class="form-label">💰 Capital Inicial (S/)</label>
                <input type="number" id="capital" class="form-input" placeholder="Ej: 10000" step="0.01">
            </div>

            <div id="plazoGroup" class="form-group">
                <label class="form-label">📅 Plazo Total</label>
                <div class="input-group">
                    <input type="number" id="plazo" class="form-input" placeholder="Ej: 60" style="flex: 2;">
                    <select id="unidadPlazo" class="form-input" style="flex: 1;" onchange="actualizarEstadoDiaFijo()">
                        <option value="dias">Días</option>
                        <option value="semanas">Semanas</option>
                        <option value="meses" selected>Meses</option>
                    </select>
                </div>
            </div>

            <div id="tasaGroup" class="form-group">
                <label class="form-label">📊 Tasa de Interés Anual (%)</label>
                <input type="number" id="tasa" class="form-input" placeholder="Ej: 20" step="0.01">
            </div>

            <div class="form-group">
                <label class="form-label">🔢 Número de Cuotas (Total)</label>
                <input type="number" id="numCuotas" class="form-input" placeholder="Ej: 12" required>
            </div>

            <!-- Sección de Gracia -->
            <div class="form-group"
                style="background: #F3F4F6; padding: 15px; border-radius: 12px; border: 1px solid #E5E7EB;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <input type="checkbox" id="checkGracia" onchange="toggleGracia()"
                        style="width: 20px; height: 20px;">
                    <label for="checkGracia" class="form-label" style="margin-bottom: 0;">Solicitar Periodo de
                        Gracia</label>
                </div>

                <div id="graciaOptions" class="hidden">
                    <div class="input-group">
                        <div style="flex: 1;">
                            <label class="form-label" style="font-size: 0.9em;">Días de Gracia (Calendario)</label>
                            <input type="number" id="diasGracia" class="form-input" placeholder="Ej: 30" min="1">
                            <small style="color: #6B7280; display: block; margin-top: 5px;">El inicio de los pagos se
                                postergará estos días sin generar intereses.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección de Día de Pago Fijo -->
            <div class="form-group"
                style="background: #F3F4F6; padding: 15px; border-radius: 12px; border: 1px solid #E5E7EB;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <input type="checkbox" id="checkDiaFijo" onchange="toggleDiaFijo()"
                        style="width: 20px; height: 20px;">
                    <label for="checkDiaFijo" class="form-label" style="margin-bottom: 0;">Elegir Día de Pago
                        Fijo</label>
                </div>

                <div id="diaFijoOptions" class="hidden">
                    <label class="form-label" style="font-size: 0.9em;">Día del mes para pagar</label>
                    <input type="number" id="diaPago" class="form-input" placeholder="Ej: 5" min="1" max="30">

                    <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                        <input type="checkbox" id="checkProximoMes" style="width: 18px; height: 18px;">
                        <label for="checkProximoMes" class="form-label"
                            style="margin-bottom: 0; font-size: 0.9em; font-weight: normal;">Iniciar pagos el próximo
                            mes</label>
                    </div>

                    <small style="color: #6B7280; display: block; margin-top: 5px;">Si el plazo no es mensual, esta
                        opción se ignorará.</small>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="calcular()">✨ Calcular</button>
                <button class="btn btn-secondary" onclick="reiniciar()">🔄 Reiniciar</button>
            </div>

            <div id="resultBox" class="result-box hidden">
                <div class="result-label">Resultado:</div>
                <div class="result-value" id="resultValue"></div>
            </div>
        </div>

        <!-- Tabla de Amortización -->
        <div class="card hidden" id="tableCard">
            <h2 class="section-title">
                <span class="option-icon">📋</span>
                Tabla de Amortización
            </h2>
            <button class="btn btn-download" onclick="descargarPDF()">📥 Descargar PDF</button>
            <div class="table-container">
                <table id="tablaAmortizacion">
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th>Fecha de Pago</th>
                            <th>Cuota</th>
                            <th>Interés</th>
                            <th>Capital</th>
                            <th>Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let datosCalculados = {};

        // Función para habilitar/deshabilitar Día Fijo según Unidad de Plazo
        function actualizarEstadoDiaFijo() {
            const unidad = document.getElementById('unidadPlazo').value;
            const checkDiaFijo = document.getElementById('checkDiaFijo');

            if (unidad === 'meses') {
                checkDiaFijo.disabled = false;
                checkDiaFijo.parentElement.style.opacity = '1';
                checkDiaFijo.parentElement.style.cursor = 'pointer';
            } else {
                checkDiaFijo.checked = false;
                checkDiaFijo.disabled = true;
                checkDiaFijo.parentElement.style.opacity = '0.5';
                checkDiaFijo.parentElement.style.cursor = 'not-allowed';
                toggleDiaFijo(); // Asegurar que se oculten las opciones
            }
        }

        // Establecer fecha actual por defecto
        document.getElementById('fechaInicio').valueAsDate = new Date();
        // Inicializar estado del checkbox
        actualizarEstadoDiaFijo();

        function toggleGracia() {
            const check = document.getElementById('checkGracia');
            const options = document.getElementById('graciaOptions');
            if (check.checked) {
                options.classList.remove('hidden');
            } else {
                options.classList.add('hidden');
                document.getElementById('diasGracia').value = '';
            }
        }

        function toggleDiaFijo() {
            const check = document.getElementById('checkDiaFijo');
            const options = document.getElementById('diaFijoOptions');
            if (check.checked) {
                options.classList.remove('hidden');
            } else {
                options.classList.add('hidden');
                document.getElementById('diaPago').value = '';
                document.getElementById('checkProximoMes').checked = false;
            }
        }

        function calcularTasaPorPeriodo(tasaAnual, plazo, unidad, numCuotas) {
            const diasPorCuota = unidad === 'dias' ? plazo / numCuotas :
                unidad === 'semanas' ? (plazo * 7) / numCuotas :
                    (plazo * 30) / numCuotas;
            return (tasaAnual / 100) * (diasPorCuota / 360);
        }

        function calcularFechasPago(fechaInicio, numCuotas, plazo, unidad, diaFijo, forzarProximoMes) {
            const fechas = [];
            // Fecha inicial de referencia (Inicio efectivo tras gracia)
            let fechaBase = new Date(fechaInicio);

            const esMensual = unidad === 'meses';
            const diasPorCuota = !esMensual ? (
                unidad === 'dias' ? plazo / numCuotas :
                    (plazo * 7) / numCuotas) : 0;

            // Determinar si debemos alinear al día fijo
            const usarDiaFijo = esMensual && diaFijo;
            let diaAncla = usarDiaFijo ? parseInt(diaFijo) : fechaBase.getDate();

            let fechaCursor = new Date(fechaBase);

            // CORRECCIÓN LOGICA DIA FIJO:
            // Validar si el primer pago puede ser en el MISMO mes de inicio
            // Esto ocurre solo si: Es mensual, hay día fijo, el día de inicio es menor al día fijo,
            // Y EL USUARIO NO HA FORZADO EL PRÓXIMO MES.
            let primerPagoMismoMes = false;
            if (usarDiaFijo && fechaBase.getDate() < diaAncla && !forzarProximoMes) {
                primerPagoMismoMes = true;
            }

            for (let i = 1; i <= numCuotas; i++) {
                if (esMensual) {
                    // Avanzar mes
                    // Primero seteamos al día 1 para evitar overflow
                    fechaCursor.setDate(1);

                    // Si es la primera cuota y podemos pagar este mismo mes, NO avanzamos mes.
                    // En todos los demás casos, sí avanzamos.
                    if (i === 1 && primerPagoMismoMes) {
                        // Mismo mes
                    } else {
                        fechaCursor.setMonth(fechaCursor.getMonth() + 1);
                    }

                    // Ahora intentamos volver al día ancla
                    const maxDiaMes = new Date(fechaCursor.getFullYear(), fechaCursor.getMonth() + 1, 0).getDate();
                    const diaDestino = Math.min(diaAncla, maxDiaMes);
                    fechaCursor.setDate(diaDestino);

                } else {
                    fechaCursor.setDate(fechaCursor.getDate() + diasPorCuota);
                }
                fechas.push(new Date(fechaCursor));
            }

            return fechas.map(f => f.toLocaleDateString('es-PE', {
                year: 'numeric', month: '2-digit', day: '2-digit'
            }));
        }

        function generarTablaAmortizacion(capital, numCuotas, cuota, tasaAnual, fechas, fechaInicio) {
            const tabla = [];
            let saldoRestante = capital;
            let totalInteres = 0;
            let totalAmortizacion = 0;

            // Convertir strings de fecha a objetos Date para calcular días
            const fechaObjects = fechas.map(f => {
                const parts = f.split('/');
                return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            });

            const fechaInicioObj = new Date(fechaInicio); // Fecha desembolso (ya ajustada por gracia)

            // Tasa diaria (Año comercial 360 días)
            const tasaDiaria = (tasaAnual / 100) / 360;

            let fechaAnterior = fechaInicioObj;

            for (let i = 0; i < numCuotas; i++) {
                const fechaActual = fechaObjects[i];

                // Calcular días reales transcurridos
                const diffTime = Math.abs(fechaActual - fechaAnterior);
                const diasTranscurridos = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                // Interés exacto por días
                const interes = saldoRestante * tasaDiaria * diasTranscurridos;

                // La amortización es lo que sobra de la cuota fija
                // IMPORTANTE: Si es la última cuota, ajustamos para cerrar saldo
                let amortizacion;
                let cuotaReal = cuota;

                if (i === numCuotas - 1) {
                    amortizacion = saldoRestante;
                    cuotaReal = amortizacion + interes;
                } else {
                    amortizacion = cuota - interes;
                    // CORRECCIÓN: Permitimos amortización negativa (capitalización)
                    // Si el interés supera la cuota, el saldo aumenta.
                    // Esto permite que el Goal Seek encuentre la cuota equilibrio real más alta.
                }

                saldoRestante = saldoRestante - amortizacion;
                if (Math.abs(saldoRestante) < 0.01) saldoRestante = 0;

                totalInteres += interes;
                totalAmortizacion += amortizacion;

                tabla.push({
                    cuota: i + 1,
                    fecha: fechas[i],
                    montoCuota: cuotaReal,
                    interes: interes,
                    amortizacion: amortizacion,
                    saldo: saldoRestante
                });

                fechaAnterior = fechaActual;
            }

            return { tabla, totalInteres, totalAmortizacion, totalCapital: capital };
        }

        function calcular() {
            try {
                // Modo siempre es 'cuota'
                const capital = parseFloat(document.getElementById('capital').value) || 0;
                const plazo = parseFloat(document.getElementById('plazo').value) || 0;
                const unidadPlazo = document.getElementById('unidadPlazo').value;
                const tasa = parseFloat(document.getElementById('tasa').value) || 0;
                const numCuotas = parseInt(document.getElementById('numCuotas').value) || 0;
                const fechaInicioInput = document.getElementById('fechaInicio').value;

                // Datos nuevos - Gracia y Día Fijo
                const usaGracia = document.getElementById('checkGracia').checked;
                const diasGracia = usaGracia ? (parseInt(document.getElementById('diasGracia').value) || 0) : 0;

                const usaDiaFijo = document.getElementById('checkDiaFijo').checked;
                const diaFijo = usaDiaFijo ? (document.getElementById('diaPago').value || null) : null;
                const forzarProximoMes = usaDiaFijo ? document.getElementById('checkProximoMes').checked : false; // NUEVO

                if (!fechaInicioInput) {
                    alert('Por favor selecciona una fecha de inicio');
                    return;
                }

                if (!capital || !plazo || !tasa || !numCuotas) {
                    alert('Por favor completa todos los campos requeridos.');
                    return;
                }

                // AJUSTE DE GRACIA: Desplazar la fecha de inicio
                const partesFecha = fechaInicioInput.split('-');
                let fechaInicioEfectiva = new Date(partesFecha[0], partesFecha[1] - 1, partesFecha[2]);
                fechaInicioEfectiva.setDate(fechaInicioEfectiva.getDate() + diasGracia);

                let resultado, unidad;

                // Lógica de Goal Seek para Cuota Homogénea
                // 1. Estimación Inicial
                const i = calcularTasaPorPeriodo(tasa, plazo, unidadPlazo, numCuotas);
                let cuotaEstimada = capital * (i * Math.pow(1 + i, numCuotas)) / (Math.pow(1 + i, numCuotas) - 1);

                // 2. Refinamiento Iterativo
                const fechas = calcularFechasPago(fechaInicioEfectiva, numCuotas, plazo, unidadPlazo, diaFijo, forzarProximoMes);
                let cuotaOptima = cuotaEstimada;

                for (let k = 0; k < 20; k++) {
                    const { tabla } = generarTablaAmortizacion(capital, numCuotas, cuotaOptima, tasa, fechas, fechaInicioEfectiva);
                    const ultimaCuotaReal = tabla[tabla.length - 1].montoCuota;
                    const diff = ultimaCuotaReal - cuotaOptima;

                    if (Math.abs(diff) < 0.005) break;

                    cuotaOptima += diff / numCuotas;
                }

                // REDONDEO A 0.10 SOLES (Moneda Peruana)
                // Redondear al múltiplo de 0.10 más cercano
                resultado = Math.round(cuotaOptima * 10) / 10;
                unidad = 'soles';

                document.getElementById('resultValue').textContent = `S/ ${resultado.toFixed(2)} ${unidad}`;

                if (diasGracia > 0) {
                    document.getElementById('resultValue').innerHTML += `<div style="font-size: 0.5em; margin-top: 5px;">(Inicio de pagos diferido ${diasGracia} días)</div>`;
                }

                document.getElementById('resultBox').classList.remove('hidden');

                // Generar tabla final usando el RESULTADO REDONDEADO
                const { tabla, totalInteres, totalAmortizacion, totalCapital } =
                    generarTablaAmortizacion(capital, numCuotas, resultado, tasa, fechas, fechaInicioEfectiva);

                datosCalculados = {
                    tabla,
                    totalInteres,
                    totalAmortizacion,
                    totalCapital,
                    capitalInicial: capital,
                    tasa: tasa,
                    plazo: plazo,
                    unidad: unidadPlazo,
                    numCuotas: numCuotas,
                    cuota: resultado,
                    fechaInicio: fechaInicioInput,
                    diasGracia: diasGracia
                };

                mostrarTabla(tabla, totalInteres, totalAmortizacion, totalCapital);
            } catch (error) {
                console.error(error);
                alert('Error en el cálculo. Verifica que todos los datos sean correctos.');
            }
        }

        function mostrarTabla(tabla, totalInteres, totalAmortizacion, totalCapital) {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';

            tabla.forEach(fila => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${fila.cuota}</strong></td>
                    <td>${fila.fecha}</td>
                    <td>S/ ${fila.montoCuota.toFixed(2)}</td>
                    <td class="interes-cell">S/ ${fila.interes.toFixed(2)}</td>
                    <td class="amortizacion-cell">S/ ${fila.amortizacion.toFixed(2)}</td>
                    <td class="saldo-cell">S/ ${fila.saldo.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            // Fila de totales
            // Sumar cuotas reales
            const totalCuotasReal = tabla.reduce((acc, fila) => acc + fila.montoCuota, 0);

            const trTotal = document.createElement('tr');
            trTotal.className = 'total-row';
            trTotal.innerHTML = `
                <td colspan="2"><strong>TOTALES</strong></td>
                <td><strong>S/ ${totalCuotasReal.toFixed(2)}</strong></td>
                <td class="interes-cell"><strong>S/ ${totalInteres.toFixed(2)}</strong></td>
                <td class="amortizacion-cell"><strong>S/ ${totalAmortizacion.toFixed(2)}</strong></td>
                <td></td>
            `;
            tbody.appendChild(trTotal);

            document.getElementById('tableCard').classList.remove('hidden');
        }

        function reiniciar() {
            document.getElementById('formCard').classList.remove('hidden');
            document.getElementById('tableCard').classList.add('hidden');
            document.getElementById('resultBox').classList.add('hidden');

            document.getElementById('capital').value = '';
            document.getElementById('plazo').value = '';
            document.getElementById('tasa').value = '';
            document.getElementById('numCuotas').value = '';
            document.getElementById('fechaInicio').valueAsDate = new Date();

            // Checkboxes
            document.getElementById('checkGracia').checked = false;
            document.getElementById('graciaOptions').classList.add('hidden');
            document.getElementById('diasGracia').value = '';

            document.getElementById('checkDiaFijo').checked = false;
            document.getElementById('diaFijoOptions').classList.add('hidden');
            document.getElementById('diaPago').value = '';
        }

        // Función auxiliar para convertir imagen a DataURL
        function getBase64Image(img) {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            return canvas.toDataURL("image/jpeg");
        }

        function descargarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Colores Corporativos
            const colorPrimario = [99, 102, 241]; // #6366f1 Indigo 500
            const colorSecundario = [79, 70, 229]; // #4f46e5 Indigo 600
            const colorGris = [107, 114, 128]; // #6b7280 Gray 500

            // LOGO
            try {
                const imgElement = document.querySelector('.logo');
                if (imgElement) {
                    const imgData = getBase64Image(imgElement);
                    doc.addImage(imgData, 'JPEG', 15, 10, 30, 0);
                }
            } catch (e) {
                console.warn("No se pudo cargar el logo", e);
            }

            // ENCABEZADO
            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(...colorSecundario);
            doc.text("CRONOGRAMA DE PAGOS", 195, 20, { align: "right" });

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(...colorGris);
            doc.text("ÁLAMOS IMPORT - Financiamos tu progreso", 195, 26, { align: "right" });

            // Línea divisoria
            doc.setDrawColor(...colorPrimario);
            doc.setLineWidth(0.5);
            doc.line(15, 35, 195, 35);

            // RESUMEN DEL PRÉSTAMO
            const partesFecha = datosCalculados.fechaInicio.split('-');
            const fechaFormateada = `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}`;

            doc.setFontSize(11);
            doc.setTextColor(0);

            const col1 = 15, col2 = 80, col3 = 145;
            const row1 = 45, row2 = 52;

            // Labels
            doc.setFont("helvetica", "bold");
            doc.setTextColor(60, 60, 60);
            doc.text("Fecha Inicio:", col1, row1);
            doc.text("Capital:", col2, row1);
            doc.text("Tasa Anual:", col3, row1);

            doc.text("Plazo Total:", col1, row2);
            doc.text("Cuotas:", col2, row2);
            if (datosCalculados.diasGracia > 0) doc.text("Gracia:", col3, row2);

            // Values
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100, 100, 100);

            const capitalStr = `S/ ${datosCalculados.capitalInicial.toLocaleString('es-PE', { minimumFractionDigits: 2 })}`;

            doc.text(fechaFormateada, col1 + 25, row1);
            doc.text(capitalStr, col2 + 18, row1);
            doc.text(`${datosCalculados.tasa}%`, col3 + 24, row1);

            doc.text(`${datosCalculados.plazo} ${datosCalculados.unidad}`, col1 + 25, row2);
            doc.text(`${datosCalculados.numCuotas}`, col2 + 18, row2);
            if (datosCalculados.diasGracia > 0) doc.text(`${datosCalculados.diasGracia} días`, col3 + 24, row2);

            // TABLA
            const columnas = [
                { header: 'N°', dataKey: 'cuota' },
                { header: 'Fecha Pago', dataKey: 'fecha' },
                { header: 'Cuota', dataKey: 'montoCuota' },
                { header: 'Interés', dataKey: 'interes' },
                { header: 'Capital', dataKey: 'amortizacion' },
                { header: 'Saldo', dataKey: 'saldo' },
            ];

            const bodyData = datosCalculados.tabla.map(fila => ({
                cuota: fila.cuota,
                fecha: fila.fecha,
                montoCuota: `S/ ${fila.montoCuota.toFixed(2)}`,
                interes: `S/ ${fila.interes.toFixed(2)}`,
                amortizacion: `S/ ${fila.amortizacion.toFixed(2)}`,
                saldo: `S/ ${fila.saldo.toFixed(2)}`
            }));

            const totalCuotasSum = bodyData.reduce((acc, f) => acc + parseFloat(f.montoCuota.replace('S/ ', '')), 0);

            bodyData.push({
                cuota: '',
                fecha: 'TOTALES',
                montoCuota: `S/ ${totalCuotasSum.toFixed(2)}`,
                interes: `S/ ${datosCalculados.totalInteres.toFixed(2)}`,
                amortizacion: `S/ ${datosCalculados.totalAmortizacion.toFixed(2)}`,
                saldo: ''
            });

            doc.autoTable({
                startY: 65,
                columns: columnas,
                body: bodyData,
                theme: 'striped',
                headStyles: {
                    fillColor: colorPrimario,
                    textColor: 255,
                    fontStyle: 'bold',
                    halign: 'center'
                },
                bodyStyles: { textColor: 50 },
                alternateRowStyles: { fillColor: [243, 244, 246] },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 15 },
                    1: { halign: 'center' },
                    2: { halign: 'right', fontStyle: 'bold', textColor: colorSecundario },
                    3: { halign: 'right', textColor: [220, 38, 38] },
                    4: { halign: 'right', textColor: [5, 150, 105] },
                    5: { halign: 'right', fontStyle: 'bold' }
                },
                didParseCell: function (data) {
                    if (data.row.index === bodyData.length - 1) {
                        data.cell.styles.fontStyle = 'bold';
                        data.cell.styles.fillColor = [229, 231, 235];
                        data.cell.styles.textColor = 0;
                        if (data.column.dataKey === 'interes') data.cell.styles.textColor = [220, 38, 38];
                    }
                }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            doc.setFontSize(8);
            doc.setTextColor(150);
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.text(`Generado el ${new Date().toLocaleDateString()} - Página ${i} de ${pageCount}`, 195, 290, { align: 'right' });
            }

            doc.save(`Cronograma_AlamosImport_${new Date().toISOString().split('T')[0]}.pdf`);
        }
    </script>
</body>

</html>
